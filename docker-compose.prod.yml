services:
  backend:
    build:
      context: ./backend
      target: runtime

  frontend:
    build:
      context: ./frontend
      target: runtime

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
