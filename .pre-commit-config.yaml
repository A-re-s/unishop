default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: backend · ruff format
        entry: bash -c 'cd backend && uv run ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-check
        name: backend · ruff check
        entry: bash -c 'cd backend && uv run ruff check .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: biome-check
        name: frontend · biome format & lint
        entry: bash -c 'cd frontend && npm run check:fix'
        language: system
        files: ^frontend/
        exclude: ^frontend/node_modules/
        pass_filenames: false

      - id: frontend-build
        name: frontend · production build
        entry: bash -c 'cd frontend && npm run build > /dev/null'
        language: system
        files: ^frontend/
        exclude: ^frontend/node_modules/
        pass_filenames: false
